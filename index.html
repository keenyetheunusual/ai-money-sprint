<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keenye — 30-Day AI Build & Money Sprint</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#090b10;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="sprint" src="sprint.html?v=3" title="AI Build & Money Sprint"></iframe>
<script>
const frame=document.getElementById('sprint');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=frame.contentDocument;
  if(!d)return;
  const show=id=>{w.show(id);};
  d.querySelectorAll('#weeks .week').forEach((el,i)=>{
    el.onclick=e=>{e.preventDefault();show('roadmap');w.setFilter(i+1);};
  });
  d.querySelectorAll('#daygrid .day').forEach(el=>{
    el.onclick=e=>{e.preventDefault();const n=parseInt(el.querySelector('.num')?.textContent.replace(/\D/g,''),10);if(n)w.openDay(n);};
  });
});
</script>
</body>
</html>
