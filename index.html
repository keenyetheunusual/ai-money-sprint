<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#090b10">
<title>Keenye — 30-Day AI Build & Money Sprint</title>
</head>
<body style="margin:0;background:#090b10;color:#f4f6fa;font-family:system-ui,-apple-system,Segoe UI,sans-serif">
<div id="app-loading" style="min-height:100vh;display:grid;place-items:center;color:#9ba4b5">Loading your sprint…</div>
<script>
(async function(){
  try {
    const response = await fetch('sprint.html?v=4', {cache:'no-store'});
    if (!response.ok) throw new Error('Sprint source failed to load');
    let html = await response.text();

    /* Load the actual app into this page — no iframe. */
    document.open();
    document.write(html);
    document.close();

    /* Wait for the source app's script/render cycle, then install robust
       delegated navigation. This avoids relying on inline onclick handlers,
       which were the fragile part of the previous implementation. */
    const install = () => {
      if (!window.show || !window.setFilter || !window.openDay) {
        setTimeout(install, 30);
        return;
      }

      document.addEventListener('click', function(e) {
        const week = e.target.closest && e.target.closest('#weeks .week');
        if (week) {
          e.preventDefault();
          e.stopPropagation();
          const cards = Array.from(document.querySelectorAll('#weeks .week'));
          const index = cards.indexOf(week);
          if (index >= 0) {
            window.show('roadmap');
            window.setFilter(index + 1);
            window.scrollTo(0, 0);
          }
          return;
        }

        const day = e.target.closest && e.target.closest('#daygrid .day');
        if (day) {
          e.preventDefault();
          e.stopPropagation();
          const number = day.querySelector('.num')?.textContent.match(/\d+/);
          if (number) {
            window.openDay(Number(number[0]));
            window.scrollTo(0, 0);
          }
        }
      }, true);

      document.addEventListener('click', function(e) {
        const nav = e.target.closest && e.target.closest('.nav button[data-s]');
        if (nav) {
          e.preventDefault();
          e.stopPropagation();
          window.show(nav.dataset.s);
          window.scrollTo(0, 0);
        }

        if (e.target.closest && e.target.closest('#back')) {
          e.preventDefault();
          e.stopPropagation();
          window.show('roadmap');
          window.scrollTo(0, 0);
        }
      }, true);
    };

    setTimeout(install, 0);
  } catch (error) {
    document.body.innerHTML = '<div style="padding:32px;line-height:1.6">The sprint could not load. Please refresh the page.</div>';
  }
})();
</script>
</body>
</html>
