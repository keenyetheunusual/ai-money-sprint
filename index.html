<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Keenye — 30-Day AI Build & Money Sprint</title></head><body><p style="font-family:system-ui;padding:2rem">Loading your sprint…</p><script>
(async function(){
  const fix = `<script>
(function(){
 const oldSetFilter=window.setFilter, oldOpenDay=window.openDay;
 window.show=function(id){
  document.querySelectorAll('.content>section').forEach(s=>s.style.display='none');
  const target=document.getElementById(id); if(target) target.style.display='block';
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  const nav=document.querySelector('[data-s="'+id+'"]'); if(nav) nav.classList.add('active');
  try{window.scrollTo({top:0,behavior:'smooth'});}catch(e){try{window.scrollTo(0,0);}catch(_) {}}
 };
 window.setFilter=function(w){ oldSetFilter(w); window.show('roadmap'); };
 window.openDay=function(n){ oldOpenDay(n); };
 document.querySelectorAll('#weeks .week').forEach((el,i)=>{el.onclick=function(e){e.preventDefault();e.stopPropagation();window.show('roadmap');window.setFilter(i+1);};});
 document.querySelectorAll('#daygrid .day').forEach(el=>{el.onclick=function(e){e.preventDefault();e.stopPropagation();const m=this.querySelector('.num')?.textContent.match(/\\d+/);if(m)window.openDay(Number(m[0]));};});
})();
<\/script>`;
  try{
    const r=await fetch('sprint.html?fix=1',{cache:'no-store'});
    if(!r.ok) throw new Error('Could not load sprint source');
    let html=await r.text();
    html=html.replace('</body>',fix+'</body>');
    document.open(); document.write(html); document.close();
  }catch(e){document.body.innerHTML='<p style="font-family:system-ui;padding:2rem">The sprint could not load. Please refresh.</p>';}
})();
</script></body></html>
